name: release infrastructure tests
on:
  pull_request:
    paths: ['tools/tool-release', 'tools/package-bin', 'tools/release-adapter', 'tests/**', 'packaging/**', '.github/workflows/tool-*.yml', '.github/workflows/release-tests.yml']
  push:
    branches: [trunk]
    paths: ['tools/tool-release', 'tools/package-bin', 'tools/release-adapter', 'tests/**', 'packaging/**', '.github/workflows/tool-*.yml', '.github/workflows/release-tests.yml']
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -I -m unittest discover -s tests -p 'test_*.py' -v
