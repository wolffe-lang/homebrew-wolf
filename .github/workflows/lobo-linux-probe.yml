# A probe, on its own branch: doors' `lobo (ubuntu-latest)` row went red
# with "wolffe-lang/wolf/lobo: Broken pipe" three times at the 0.2.39 doors
# head and green at trunk, with lobo's formula the same in both. A first
# probe (each doors commit, --verbose --debug, output to a file) was green
# everywhere; a second (doors' own steps) was red at trunk too. This one
# installs at trunk with no flag, --verbose, --debug and both, three times
# each, so the smallest flag that turns the row green is named. It changes
# nothing.
name: lobo-linux-probe

on:
  push:
    branches: [r44-lobo-linux-probe]

permissions:
  contents: read

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  probe:
    name: lobo on Linux at ${{ matrix.tree }}, ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tree: [6df47a65a89d757fe8965ca5c01f0e99d7737f86]
        mode: [plain, verbose, debug, verbose-debug]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.tree }}
      - name: Linuxbrew on PATH
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: The tap, from this checkout
        run: |
          set -euo pipefail
          git log -1 --format='tree %h %s'
          taps="$(brew --repository)/Library/Taps/wolffe-lang"
          rm -rf "$taps/homebrew-wolf"
          mkdir -p "$taps/homebrew-wolf"
          cp -R "$GITHUB_WORKSPACE/." "$taps/homebrew-wolf/"
          brew trust wolffe-lang/wolf || true
          brew info wolffe-lang/wolf/lobo
      - name: brew install --build-from-source, three times
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
        run: |
          set -uo pipefail
          worst=0
          for attempt in 1 2 3; do
            case "$MODE" in
              plain) flags=() ;;
              verbose) flags=(--verbose) ;;
              debug) flags=(--debug) ;;
              verbose-debug) flags=(--verbose --debug) ;;
            esac
            rc=0
            brew install --build-from-source "${flags[@]}" wolffe-lang/wolf/lobo > "$RUNNER_TEMP/install-$attempt.log" 2>&1 || rc=$?
            [ "$rc" -eq 0 ] || tail -40 "$RUNNER_TEMP/install-$attempt.log"
            echo "PROBE mode=$MODE attempt=$attempt install exit=$rc"
            [ "$rc" -eq 0 ] || worst=$rc
            brew uninstall --force lobo > /dev/null 2>&1 || true
          done
          exit "$worst"
