# A probe, on its own branch: doors' `lobo (ubuntu-latest)` row is red at
# trunk with "wolffe-lang/wolf/lobo: Broken pipe". The third probe showed the
# FIRST install in a job failing and a retry passing, and its --debug log
# shows Homebrew running `git credential-osxkeychain get` on Linux just
# before the error: it asks a macOS keychain helper, which Linux does not
# have, for a GitHub token, and the write to it breaks. This one installs
# once per job, as doors does, three jobs each: unchanged (the control), with
# the job's token given to Homebrew (HOMEBREW_GITHUB_API_TOKEN), and with
# Homebrew's GitHub API calls turned off (HOMEBREW_NO_GITHUB_API). It
# changes nothing.
name: lobo-linux-probe

on:
  push:
    branches: [r44-lobo-linux-probe]

permissions:
  contents: read

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  probe:
    name: lobo on Linux at trunk, ${{ matrix.mode }} ${{ matrix.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [control, token, no-github-api]
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 6df47a65a89d757fe8965ca5c01f0e99d7737f86
      - name: Linuxbrew on PATH
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: The tap, from this checkout
        run: |
          set -euo pipefail
          git log -1 --format='tree %h %s'
          taps="$(brew --repository)/Library/Taps/wolffe-lang"
          rm -rf "$taps/homebrew-wolf"
          mkdir -p "$taps/homebrew-wolf"
          cp -R "$GITHUB_WORKSPACE/." "$taps/homebrew-wolf/"
          brew trust wolffe-lang/wolf || true
          brew info wolffe-lang/wolf/lobo
      - name: brew install --build-from-source, once
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          case "$MODE" in
            token) export HOMEBREW_GITHUB_API_TOKEN=$TOKEN ;;
            no-github-api) export HOMEBREW_NO_GITHUB_API=1 ;;
          esac
          rc=0
          brew install --build-from-source wolffe-lang/wolf/lobo || rc=$?
          echo "PROBE mode=$MODE install exit=$rc"
          exit "$rc"
