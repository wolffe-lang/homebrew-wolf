# doors — the tap's install gate (homebrew-wolf#1).
#
# doors-fresh.yml asks whether each formula still names the CURRENT
# release. Nothing asked whether it INSTALLS. A formula whose `tag:` and
# `revision:` disagree, or whose build breaks at the new tag, was green
# in this tap until a user ran `brew install` — and the bump commit that
# broke it is the same commit nobody else runs.
#
# So: on every push to trunk and every pull request that touches a
# formula, build each one from source on a macOS runner and run its
# `test do` block. The version line is echoed into the log on purpose:
# D57 says a release build prints the bare version and its pin, and a
# packaging gate that never reads the stamp is not reading the thing the
# package exists to deliver.
#
# The tap is installed FROM THIS CHECKOUT, not from `brew tap
# wolffe-lang/wolf`. Tapping the published remote would clone trunk and
# test that — which is exactly the commit under review's own content
# being ignored.
#
# Budget: `wolf` is a source build of the compiler plus `cargo xtask
# dist`'s smoke, and `lupin` builds the interpreter. Both are tens of
# minutes. The three formulae are separate jobs so they run beside each
# other and a slow one never hides a fast one's red.
#
# LINUX (homebrew-wolf#5, tl02). wolf's native tier serves macOS arm64 AND
# linux x86-64, and this gate was macOS-only. The half that was genuinely
# untested is `lobo.rb`'s: it is the one formula with platform-specific
# CONTENT — an `on_linux do / on_intel do` block carrying its own url and its
# own sha256, which no job in this repository had ever fetched. So `lobo` now
# runs on `ubuntu-latest` too (Homebrew on Linux, preinstalled on the runner
# image at /home/linuxbrew/.linuxbrew), and it is cheap: a prebuilt archive,
# minutes, not an hour of compiling.
#
# `wolf` and `lupin` are NOT doubled, and the reason is that they have no
# linux half in this repository to test. Both are git formulae — one url, one
# tag, one revision, no `on_linux` block, no second digest — so an
# ubuntu-latest job would not exercise one byte of formula that macOS does
# not. What it would exercise is the COMPILER on linux x86-64, which is
# wolf-lang's and wolf-interp's own CI, on every commit, not a tap concern on
# every formula bump; and it would add an hour-plus of runner time to every
# push here. That a Linuxbrew source build of them is nonetheless worth having
# somewhere, on a schedule rather than a push, is filed as homebrew-wolf#7.
#
# The digest leg #5 offered as a minimum is already covered and is not
# duplicated here: `doors-fresh` reads every sha256 `lobo.rb` declares — both
# the darwin one and the linux one — against the digests the live release
# publishes, on a daily schedule (#4).

name: doors

on:
  push:
    branches: [trunk]
    paths:
      - 'Formula/**'
      - '.github/workflows/doors.yml'
  pull_request:
    paths:
      - 'Formula/**'
      - '.github/workflows/doors.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doors-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  install:
    name: ${{ matrix.formula }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # Written out rather than `os: [...] x formula: [...]`, because the
        # product is not what is wanted: only `lobo` has a linux half (above).
        include:
          - { os: macos-latest,  formula: wolf }
          - { os: macos-latest,  formula: lupin }
          - { os: macos-latest,  formula: lobo }
          - { os: ubuntu-latest, formula: lobo }

    steps:
      - uses: actions/checkout@v5

      - name: Linuxbrew on PATH
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The ubuntu runner image ships Homebrew at this prefix. Adding the
          # directory is enough — brew computes the rest of its own
          # environment — and it is a no-op where the image already did it.
          test -x /home/linuxbrew/.linuxbrew/bin/brew
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: The tap, from this checkout
        run: |
          set -euo pipefail
          taps="$(brew --repository)/Library/Taps/wolffe-lang"
          rm -rf "$taps/homebrew-wolf"
          mkdir -p "$taps/homebrew-wolf"
          # A copy, not a symlink and not `brew tap <url>`: Homebrew wants
          # a real git working copy in Library/Taps, and the whole point
          # of this gate is that the formula it installs is the one in
          # this commit.
          cp -R "$GITHUB_WORKSPACE/." "$taps/homebrew-wolf/"
          # Homebrew refuses to load formulae from an untrusted
          # third-party tap and reports it as "invalid syntax in tap!",
          # which is not what is wrong (README). `|| true`: the
          # subcommand is newer than some Homebrew versions, and where it
          # does not exist there is nothing to trust.
          brew trust wolffe-lang/wolf || true
          test -f "$taps/homebrew-wolf/Formula/${{ matrix.formula }}.rb"
          # Unpiped on purpose. `brew info | head` closes the pipe on
          # Homebrew mid-write, ruby raises EPIPE, and `pipefail` makes
          # that the step's exit code — a green tap reported as a red
          # one. Measured on this workflow's own first run.
          brew info wolffe-lang/wolf/${{ matrix.formula }}

      - name: ruby -c
        run: ruby -c "Formula/${{ matrix.formula }}.rb"

      - name: brew install --build-from-source
        run: brew install --build-from-source wolffe-lang/wolf/${{ matrix.formula }}

      - name: The D57 stamp, in the log
        run: |
          set -euo pipefail
          case "${{ matrix.formula }}" in
            wolf)  "$(brew --prefix)/bin/wolf" --version ;;
            lupin) "$(brew --prefix)/bin/lupin" --version ;;
            # lobo writes -v to STDERR because nginx does; reading stdout
            # alone gets an empty string from a perfect binary.
            lobo)  "$(brew --prefix)/bin/lobo" -v 2>&1 ;;
          esac

      - name: brew test
        run: brew test --verbose wolffe-lang/wolf/${{ matrix.formula }}

      - name: brew linkage
        run: brew linkage --test wolffe-lang/wolf/${{ matrix.formula }}
